<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="right-panel-clip">
      <rect x="500" y="36" width="380" height="164"/>
    </clipPath>
  </defs>


  <rect width="880" height="180" fill="url(#bg)"/>

  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="36" x2="880" y2="36"/>
    <line x1="490" y1="36" x2="490" y2="180" stroke-dasharray="4 4" opacity="0.6"/>

    <line x1="40" y1="36" x2="40" y2="180" stroke-dasharray="4 4" opacity="0.6"/>
  </g>
  <rect x="540" y="36" width="340" height="128" fill="url(#right-panel-clip)"/>

<!-- TOPBAR -->
    <circle cx="32" cy="21" r="3" fill="#58a6a6"></circle>
    <text x="42" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590" letter-spacing="1">
        <tspan fill="#58a6a6"></tspan> koniorj / main.cpp
    </text>
    <text x="865" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7ee787" letter-spacing="1">AGH Computer Science Student</text>

<!-- LEFT SIDE -->
  <text x="64" y="80" font-family="Cascadia Code, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="600" fill="#e6edf3" letter-spacing="0.5">Justyna Konior</text>
    <a href="https://www.linkedin.com/in/justyna-konior/" target="_blank">
      <g transform="translate(332, 65)">
        <rect x="0" y="0" width="65" height="15" rx="3" fill="#161b22" stroke="#5588A3" stroke-width="1"/>
        <text x="32" y="10.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="bold" fill="#5588A3">LinkedIn ↗</text>
      </g>
    </a>
  <text x="66" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5a9bd1" letter-spacing="3">CS STUDENT @ AGH</text>
  <text x="66" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7d8590" letter-spacing="0.5">Python · C++ · Computer Vision · AI In Medicine</text>
  
  <g transform="translate(21, 139)">
    <circle cx="48" cy="7" r="3" fill="#58a6a6">
        <animate 
        attributeName="opacity" 
        values="1;0.3;1" 
        dur="2s" 
        repeatCount="indefinite" 
        />
    </circle>

    <text x="60" y="9.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7d8590">
        member @ AI in Medicine Research Group
    </text>
  </g>
  
<!-- RIGHT SIDE - ANIMATION -->

  <g clip-path="url(#right-panel-clip)">
    <g transform="translate(690, 110)">

      <circle cx="0" cy="0" r="60" stroke="#21262d" stroke-width="1" fill="none"/>
      <circle cx="0" cy="0" r="40" stroke="#30363d" stroke-width="1" fill="none"/>

      <g stroke="#58a6a6" stroke-width="1" fill="none" opacity="0.45">
        <polygon points="0,-55 47.6,27.5 -47.6,27.5"/>
        <polygon points="0,55 47.6,-27.5 -47.6,-27.5"/>
        
        <circle cx="0" cy="-30" r="30"/>
        <circle cx="26" cy="-15" r="30"/>
        <circle cx="26" cy="15" r="30"/>
        <circle cx="0" cy="30" r="30"/>
        <circle cx="-26" cy="15" r="30"/>
        <circle cx="-26" cy="-15" r="30"/>

        <animateTransform 
          attributeName="transform" 
          type="rotate" 
          from="0" to="360" 
          dur="25s" 
          repeatCount="indefinite"/>
      </g>

        <g stroke="#7ee787" stroke-width="0.8" fill="none" opacity="0.6">
        <polygon points="0,-35 30.3,17.5 -30.3,17.5"/>
        <polygon points="0,35 30.3,-17.5 -30.3,-17.5"/>
        
        <circle cx="0" cy="0" r="20" stroke="#79c0ff" stroke-width="1"/>
        <circle cx="0" cy="0" r="10" stroke="#7ee787" stroke-width="0.8"/>

        <animateTransform 
          attributeName="transform" 
          type="rotate" 
          from="360" to="0" 
          dur="10s" 
          repeatCount="indefinite"/>
      </g>

      <circle cx="0" cy="0" r="4" fill="#7ee787">
        <animate attributeName="r" values="2;5;2" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
      </circle>

      <circle cx="0" cy="0" r="50" stroke="#79c0ff" stroke-width="0.8" fill="none" opacity="0">
        <animate attributeName="r" values="20;65;20" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
      </circle>


    </g>
  </g>

</svg>